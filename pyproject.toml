[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-tracker-repro"
version = "0.1.0"
description = "Reproduction experiments for last-token attention analysis in prompt injection detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1.0",
  "bitsandbytes>=0.43.0",
  "datasets>=2.20.0",
  "matplotlib>=3.8.0",
  "python-dotenv>=1.2.2",
  "torch>=2.3.0",
  "transformers>=4.46.0",
]

[project.scripts]
inspect-last-token-attention = "last_token_attention.cli:main"
compare-last-token-attention = "last_token_attention.compare_cli:main"
evaluate-focus-scores = "last_token_attention.evaluate_focus_cli:main"
evaluate-focus-all-models = "last_token_attention.evaluate_batch_cli:main"
prepare-eval-data = "last_token_attention.prepare_eval_data_cli:main"
head-generalization = "last_token_attention.head_generalization:main"
run-all-models = "last_token_attention.batch_cli:main"
manage-ollama-models = "last_token_attention.ollama_cli:main"
evaluate-baseline-detector = "last_token_attention.baselines.cli:main"
evaluate-protect-ai = "last_token_attention.baselines.protect_ai:main"
evaluate-prompt-guard = "last_token_attention.baselines.prompt_guard:main"
evaluate-llm-based = "last_token_attention.baselines.llm_based:main"
evaluate-known-answer = "last_token_attention.baselines.known_answer:main"
evaluate-all-baselines = "last_token_attention.baselines.batch_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["last_token_attention*"]
